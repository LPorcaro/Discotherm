<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discotherm</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #161616;
      --surface2: #1e1e1e;
      --border: #2a2a2a;
      --text: #ffffff;
      --muted: #888888;
      --muted2: #555555;
      --cyan: #00e5ff;
      --cyan-dim: rgba(0, 229, 255, 0.12);
      --orange: #ff9500;
      --red: #ff3b30;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 64px 20px 80px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    /* ── Header ── */
    .header { text-align: center; }
    .header-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .header-title .logo { height: 40px; width: auto; display: block; }
    .header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--text);
    }
    .header h1 span { color: var(--cyan); }
    .header p {
      margin-top: 8px;
      font-size: 0.95rem;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    /* ── Search ── */
    .search-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
    }
    .search-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .search-row { display: flex; gap: 10px; }
    input[type="text"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]::placeholder { color: var(--muted2); }
    input[type="text"]:focus { border-color: var(--cyan); }
    button {
      background: var(--cyan);
      border: none;
      border-radius: 10px;
      color: #000;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 12px 22px;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
      letter-spacing: 0.01em;
    }
    button:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    button.btn-secondary {
      background: transparent;
      border: 1px solid var(--cyan);
      color: var(--cyan);
      padding: 9px 16px;
      font-size: 0.82rem;
    }
    #pdf-btn { margin-left: auto; align-self: center; flex-shrink: 0; }

    /* ── Loading ── */
    .loading {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 24px 0;
    }
    .loading.visible { display: flex; }
    .spinner {
      width: 32px; height: 32px;
      border: 2px solid var(--border);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { color: var(--muted); font-size: 0.85rem; }

    /* ── Error ── */
    .error-box {
      display: none;
      background: rgba(255, 59, 48, 0.08);
      border: 1px solid rgba(255, 59, 48, 0.3);
      border-radius: 12px;
      padding: 16px 20px;
      color: #ff6b6b;
      font-size: 0.9rem;
    }
    .error-box.visible { display: block; }

    /* ── Results ── */
    .results { display: none; flex-direction: column; gap: 20px; }
    .results.visible { display: flex; }

    .results-header {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 16px;
    }
    .results-header .artist-thumb {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--border);
      border: 1px solid var(--border);
    }
    .results-header .artist-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .results-header h2 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .results-header .track-count {
      font-size: 0.82rem;
      color: var(--muted);
    }
    .touring-badge {
      display: none;
      align-items: center;
      gap: 6px;
      align-self: flex-start;
      margin-top: 2px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--cyan);
      background: color-mix(in srgb, var(--cyan) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--cyan) 35%, transparent);
    }
    .touring-badge.show { display: inline-flex; }

    /* ── Songstats stat chips ── */
    .stat-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .stat-chip {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1 1 120px;
      min-width: 110px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.16,1,0.3,1);
    }
    .stat-chip.in { opacity: 1; transform: translateY(0); }
    .stat-chip-val {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .stat-chip-key {
      font-size: 0.68rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* ── Fan-engagement callout (highlighted banner, distinct from diagnostic cards) ── */
    .fan-callout {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 0.9rem;
      line-height: 1.5;
      color: var(--text);
      background: linear-gradient(135deg,
        color-mix(in srgb, var(--cyan) 14%, transparent),
        color-mix(in srgb, var(--cyan) 4%, transparent));
      border: 1px solid color-mix(in srgb, var(--cyan) 30%, transparent);
      border-left: 3px solid var(--cyan);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.16,1,0.3,1);
    }
    .fan-callout.show { display: flex; }
    .fan-callout.in { opacity: 1; transform: translateY(0); }
    .fan-callout .fan-icon { font-size: 1.4rem; flex-shrink: 0; line-height: 1; }
    .fan-callout b { color: var(--cyan); font-weight: 800; }

    @media (prefers-reduced-motion: reduce) {
      .stat-chip, .fan-callout { transition: none; }
    }

    /* ── Score thermometer ── */
    .score-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .score-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .score-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .status-badge {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
    }
    .status-badge.good    { background: rgba(0,229,255,0.12); color: var(--cyan); }
    .status-badge.warning { background: rgba(255,149,0,0.12); color: var(--orange); }
    .status-badge.critical{ background: rgba(255,59,48,0.12); color: var(--red); }

    .score-number {
      font-size: 5rem;
      font-weight: 900;
      letter-spacing: -0.05em;
      line-height: 1;
      display: inline-block;
      transform-origin: left center;
      transition: color 0.12s linear;
      will-change: transform;
      font-variant-numeric: tabular-nums;
    }
    .score-number.good    { color: var(--cyan); }
    .score-number.warning { color: var(--orange); }
    .score-number.critical{ color: var(--red); }

    /* One-shot pulse + settling glow once the count-up lands. currentColor = the final
       interpolated score color set inline by the rAF animation. */
    @keyframes scoreSettle {
      0%   { text-shadow: 0 0 0 transparent;       transform: scale(1); }
      35%  { text-shadow: 0 0 26px currentColor;   transform: scale(1.05); }
      100% { text-shadow: 0 0 12px color-mix(in srgb, currentColor 40%, transparent);
             transform: scale(1); }
    }
    .score-number.settled {
      animation: scoreSettle 0.9s cubic-bezier(0.16,1,0.3,1) forwards;
    }
    @media (prefers-reduced-motion: reduce) {
      .score-number.settled { animation: none; }
    }

    .thermometer-track {
      height: 8px;
      background: var(--surface2);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }
    .thermometer-fill {
      height: 100%;
      border-radius: 99px;
      /* width + background are driven per-frame by requestAnimationFrame, so no CSS transition */
    }
    .thermometer-fill.good    { background: var(--cyan); }
    .thermometer-fill.warning { background: var(--orange); }
    .thermometer-fill.critical{ background: var(--red); }

    .thermometer-ticks {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
    }
    .thermometer-ticks span {
      font-size: 0.68rem;
      color: var(--muted2);
    }

    /* ── Diagnostic cards ── */
    .diagnostics-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .diagnostic-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: border-color 0.2s;
    }
    .diagnostic-card:hover { border-color: #333; }

    .diag-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .diag-name {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
    }
    .diag-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .diag-score {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .diag-score.good    { color: var(--cyan); }
    .diag-score.warning { color: var(--orange); }
    .diag-score.critical{ color: var(--red); }

    .diag-bar-track {
      height: 4px;
      background: var(--surface2);
      border-radius: 99px;
      overflow: hidden;
    }
    .diag-bar-fill {
      height: 100%;
      border-radius: 99px;
      /* width driven per-frame by requestAnimationFrame (staggered per card) */
    }
    .diag-bar-fill.good    { background: var(--cyan); }
    .diag-bar-fill.warning { background: var(--orange); }
    .diag-bar-fill.critical{ background: var(--red); }

    .diag-details {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .diag-stat { display: flex; flex-direction: column; gap: 2px; }
    .diag-stat-val {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }
    .diag-stat-key {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .diag-calc { margin-top: 2px; }
    .diag-calc summary {
      cursor: pointer;
      font-size: 0.75rem;
      color: var(--muted);
      list-style: none;
      user-select: none;
      width: fit-content;
    }
    .diag-calc summary::-webkit-details-marker { display: none; }
    .diag-calc summary::before { content: '▸ '; font-size: 0.7rem; }
    .diag-calc[open] summary::before { content: '▾ '; }
    .diag-calc summary:hover { color: var(--text); }
    .diag-calc[open] summary { margin-bottom: 10px; }

    .mood-dist { display: flex; flex-wrap: wrap; gap: 6px; }
    .mood-chip {
      font-size: 0.72rem;
      color: var(--muted);
      background: var(--border);
      padding: 2px 9px;
      border-radius: 999px;
    }
    .mood-chip b { color: var(--text); font-weight: 700; }
    .mood-chip.good     { color: var(--cyan); background: rgba(0,229,255,0.12); }
    .mood-chip.critical { color: var(--red);  background: rgba(255,59,48,0.12); }

    .diag-rec {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.6;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }

    .note-text {
      font-size: 0.75rem;
      color: var(--muted2);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="header">
      <div class="header-title">
        <img src="/static/logo.svg" alt="Discotherm logo" class="logo" />
        <h1><span>Disco</span>therm</h1>
      </div>
      <p>Is anybody out there?</p>
    </div>

    <div class="search-card">
      <label class="search-label" for="artist-input">Artist name</label>
      <div class="search-row">
        <input id="artist-input" type="text" placeholder="e.g. Sufjan Stevens" autocomplete="off" />
        <button id="submit-btn">Run Report</button>
      </div>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p id="loading-msg">Fetching data from Musixmatch &amp; Songstats…</p>
    </div>

    <div class="error-box" id="error-box"></div>

    <div class="results" id="results">
      <div class="results-header">
        <img class="artist-thumb" id="res-artist-thumb" alt="" />
        <div class="artist-meta">
          <h2 id="res-artist-name"></h2>
          <span class="track-count" id="res-track-count"></span>
          <span class="touring-badge" id="res-touring-badge"></span>
        </div>
        <button id="pdf-btn" class="btn-secondary" type="button">📄 Download PDF Report</button>
      </div>

      <div class="stat-chips" id="res-stat-chips"></div>

      <div class="fan-callout" id="res-fan-callout"></div>

      <div class="score-card">
        <div class="score-top">
          <span class="score-label">Overall Score</span>
          <span class="status-badge" id="res-status-badge"></span>
        </div>
        <div class="score-number" id="res-score-number"></div>
        <div>
          <div class="thermometer-track">
            <div class="thermometer-fill" id="res-thermo" style="width:0%"></div>
          </div>
          <div class="thermometer-ticks">
            <span>0</span><span>25</span><span>50</span><span>75</span><span>100</span>
          </div>
        </div>
      </div>

      <span class="diagnostics-label">Diagnostics</span>
      <div id="diag-container"></div>

      <p class="note-text" id="res-note"></p>
    </div>

  </div>

  <script>
    const input   = document.getElementById('artist-input');
    const btn     = document.getElementById('submit-btn');
    const loading = document.getElementById('loading');
    const loadMsg = document.getElementById('loading-msg');
    const errBox  = document.getElementById('error-box');
    const results = document.getElementById('results');

    function statusClass(status) {
      return { good: 'good', warning: 'warning', critical: 'critical' }[status] || 'warning';
    }

    // Compact number formatter: 14796537 → "14.8M", 2609194 → "2.6M", 625 → "625".
    function compactNum(n) {
      if (n == null || isNaN(Number(n))) return null;
      n = Number(n);
      const fmt = (v, suf) => (v >= 100 ? String(Math.round(v)) : v.toFixed(1).replace(/\.0$/, '')) + suf;
      if (n >= 1e9) return fmt(n / 1e9, 'B');
      if (n >= 1e6) return fmt(n / 1e6, 'M');
      if (n >= 1e3) return fmt(n / 1e3, 'K');
      return String(Math.round(n));
    }

    // Build the Songstats stat chips (monthly listeners / followers / popularity). Chips with
    // no data are skipped. Returns the freshly-created chip elements (for the reveal stagger).
    function renderStatChips(chips) {
      const defs = [
        ['monthly_listeners', 'Monthly Listeners', true],
        ['followers', 'Followers', true],
        ['popularity', 'Popularity', false],
      ];
      const host = document.getElementById('res-stat-chips');
      host.innerHTML = defs.map(([key, label, compact]) => {
        const raw = chips ? chips[key] : null;
        if (raw == null) return '';
        const val = compact ? compactNum(raw) : String(raw);
        if (val == null) return '';
        return `<div class="stat-chip"><span class="stat-chip-val">${val}</span>` +
               `<span class="stat-chip-key">${label}</span></div>`;
      }).join('');
      return Array.from(host.querySelectorAll('.stat-chip'));
    }

    // Fan-engagement callout — only shown when TikTok creates and/or Shazams are > 0.
    function renderFanCallout(fe) {
      const el = document.getElementById('res-fan-callout');
      el.classList.remove('in');
      const tk = fe && Number(fe.tiktok_creates) > 0 ? Number(fe.tiktok_creates) : 0;
      const sz = fe && Number(fe.shazam_count) > 0 ? Number(fe.shazam_count) : 0;
      if (!tk && !sz) {
        el.classList.remove('show');
        el.innerHTML = '';
        el.style.transitionDelay = '';
        return false;
      }
      const parts = [];
      if (tk) parts.push(`<b>${compactNum(tk)}</b> TikTok creates`);
      if (sz) parts.push(`<b>${compactNum(sz)}</b> Shazams`);
      el.innerHTML = `<span class="fan-icon">🎵</span>` +
        `<span>${parts.join(' and ')} show real fans are actively engaging with this music.</span>`;
      el.classList.add('show');
      return true;
    }

    /* ── Score count-up animation helpers (plain rAF + CSS, no libraries) ── */
    // Bumped once per report render; any in-flight animation from a prior report sees a
    // stale token and bails so back-to-back runs never fight over the same DOM nodes.
    let renderVersion = 0;
    const RED = [255, 59, 48], ORANGE = [255, 149, 0], CYAN = [0, 229, 255];
    const prefersReducedMotion = () =>
      window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function smoothstep(e0, e1, x) {
      const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0)));
      return t * t * (3 - 2 * t);
    }
    function lerpColor(a, b, t) {
      return [
        Math.round(a[0] + (b[0] - a[0]) * t),
        Math.round(a[1] + (b[1] - a[1]) * t),
        Math.round(a[2] + (b[2] - a[2]) * t),
      ];
    }
    const rgb = (c) => `rgb(${c[0]},${c[1]},${c[2]})`;

    // Map a score (0-100) to a colour that blends red→orange→cyan, holding each band's
    // status colour solid and cross-fading smoothly across the 30 and 60 thresholds.
    function scoreColor(v) {
      if (v <= 25) return RED;
      if (v < 35)  return lerpColor(RED, ORANGE, smoothstep(25, 35, v));
      if (v <= 55) return ORANGE;
      if (v < 65)  return lerpColor(ORANGE, CYAN, smoothstep(55, 65, v));
      return CYAN;
    }

    // Drive an eased 0→1 progress over `duration` ms via requestAnimationFrame, after an
    // optional `delay`. Honours reduced-motion by snapping to the final frame instantly.
    // `isStale()` lets a newer report cancel this run: once stale, no further DOM mutation.
    function animateProgress({ duration, delay = 0, onFrame, onDone, isStale }) {
      const stale = () => (isStale ? isStale() : false);
      if (prefersReducedMotion()) {
        if (stale()) return;
        onFrame(1);
        if (onDone) onDone();
        return;
      }
      const start = () => {
        if (stale()) return;
        let t0 = null;
        function step(ts) {
          if (stale()) return;
          if (t0 === null) t0 = ts;
          const t = Math.min(1, (ts - t0) / duration);
          onFrame(easeOutCubic(t));
          if (t < 1) requestAnimationFrame(step);
          else if (onDone) onDone();
        }
        requestAnimationFrame(step);
      };
      if (delay > 0) setTimeout(start, delay); else start();
    }

    function fmt(val) {
      if (val == null) return '—';
      if (typeof val === 'number') {
        if (val >= 1e9) return (val / 1e9).toFixed(2) + 'B';
        if (val >= 1e6) return (val / 1e6).toFixed(1) + 'M';
        if (val >= 1e3) return (val / 1e3).toFixed(1) + 'K';
        return val.toLocaleString();
      }
      return String(val);
    }

    const DETAIL_LABELS = {
      tracks_total:              'Total Tracks',
      tracks_with_full_metadata: 'Full Metadata',
      total_favourites:          'Total Saves',
      top3_favourites:           'Top-3 Saves',
      concentration_pct:         'Concentration',
      playlists_total:           'Total Playlists',
      playlists_editorial:       'Editorial',
      editorial_pct:             'Editorial %',
      tracks_analyzed:           'Tracks Analyzed',
      tracks_skipped:            'Skipped',
      avg_cosine_similarity:     'Avg Similarity',
    };
    // Internal calculation breakdown — hidden behind a toggle, not shown by default.
    const DEBUG_LABELS = {
      pct_component: 'Percentage score',
      abs_component: 'Absolute reach score',
    };

    function statHTML(k, v, label) {
      const display = k.endsWith('_pct')
        ? (typeof v === 'number' ? v.toFixed(2) + '%' : v)
        : fmt(v);
      return `<div class="diag-stat">
        <span class="diag-stat-val">${display}</span>
        <span class="diag-stat-key">${label}</span>
      </div>`;
    }

    function detailRows(detail) {
      return Object.entries(detail)
        // Skip nulls, debug fields, and nested objects/arrays (e.g. top_moods,
        // rendered separately as chips).
        .filter(([k, v]) => v != null && typeof v !== 'object' && !(k in DEBUG_LABELS))
        .map(([k, v]) => statHTML(k, v, DETAIL_LABELS[k] || k))
        .join('');
    }

    function topMoodsHTML(moods) {
      return moods
        .map((mood, i) => `<span class="mood-chip"><b>${i + 1}</b> ${mood}</span>`)
        .join('');
    }

    function debugRows(detail) {
      return Object.entries(detail)
        .filter(([k, v]) => v != null && (k in DEBUG_LABELS))
        .map(([k, v]) => statHTML(k, v, DEBUG_LABELS[k]))
        .join('');
    }

    function platformGapHTML(detail) {
      const active = detail.platforms_active || [];
      const inactive = detail.platforms_inactive || [];
      if (!active.length && !inactive.length) return '';
      const chips = (list, cls) => list
        .map(p => `<span class="mood-chip ${cls}">${p}</span>`).join('');
      return `<div class="mood-dist">${chips(active, 'good')}${chips(inactive, 'critical')}</div>`;
    }

    function renderDiagnostic(d) {
      const sc = statusClass(d.status);
      return `
        <div class="diagnostic-card">
          <div class="diag-top">
            <span class="diag-name">${d.name.replace(/_/g,' ')}</span>
            <div class="diag-right">
              <span class="diag-score ${sc}" data-target="${d.score}">0</span>
              <span class="status-badge ${sc}">${d.status}</span>
            </div>
          </div>
          <div class="diag-bar-track">
            <div class="diag-bar-fill ${sc}" data-target="${d.score}" style="width:0%"></div>
          </div>
          ${d.detail ? `<div class="diag-details">${detailRows(d.detail)}</div>` : ''}
          ${d.detail && Array.isArray(d.detail.top_moods) && d.detail.top_moods.length
            ? `<div class="mood-dist">${topMoodsHTML(d.detail.top_moods)}</div>` : ''}
          ${d.detail && Array.isArray(d.detail.platforms_checked)
            ? platformGapHTML(d.detail) : ''}
          ${d.detail && debugRows(d.detail) ? `<details class="diag-calc">
            <summary>Show calculation details</summary>
            <div class="diag-details">${debugRows(d.detail)}</div>
          </details>` : ''}
          <p class="diag-rec">${d.recommendation}</p>
        </div>`;
    }

    function setVisible(el, show) {
      el.classList.toggle('visible', show);
    }

    let reportInFlight = false;

    async function runReport() {
      // Reentrancy guard: the Enter-key handler can fire while a request is already running
      // (the disabled button only blocks clicks), so ensure only one report runs at a time —
      // this makes the latest completed report deterministic and prevents request races.
      if (reportInFlight) return;
      const name = input.value.trim();
      if (!name) return;

      reportInFlight = true;
      btn.disabled = true;
      setVisible(errBox, false);
      setVisible(results, false);
      setVisible(loading, true);
      loadMsg.textContent = 'Fetching data from Musixmatch & Songstats…';

      try {
        const res = await fetch('/artist/report', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }),
        });

        const data = await res.json();

        if (!res.ok) {
          errBox.textContent = data.detail || `Error ${res.status}`;
          setVisible(errBox, true);
          return;
        }

        // Populate header
        const PLACEHOLDER_THUMB =
          "data:image/svg+xml;utf8," +
          encodeURIComponent(
            "<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'>" +
            "<rect width='80' height='80' fill='%23cfcfcf'/></svg>"
          );
        const thumbEl = document.getElementById('res-artist-thumb');
        thumbEl.onerror = () => { thumbEl.onerror = null; thumbEl.src = PLACEHOLDER_THUMB; };
        thumbEl.src = data.artist_image_url || PLACEHOLDER_THUMB;
        thumbEl.alt = data.artist_name;

        document.getElementById('res-artist-name').textContent = data.artist_name;
        document.getElementById('res-track-count').textContent =
          `${data.total_tracks.toLocaleString()} tracks found`;

        // Wire the PDF export to the *resolved* artist name so the download matches what's shown.
        document.getElementById('pdf-btn').onclick = () => {
          window.open(
            `/artist/report/pdf?artist_name=${encodeURIComponent(data.artist_name)}`,
            '_blank',
          );
        };

        // Touring context badge (non-diagnostic annotation; omit if unavailable or no shows)
        const touringEl = document.getElementById('res-touring-badge');
        const tc = data.touring_context;
        if (tc && tc.is_active_touring_artist && tc.show_count > 0) {
          const n = tc.show_count.toLocaleString();
          let label = `🎤 Active touring artist — ${n} show${tc.show_count === 1 ? '' : 's'} in the last 12 months`;
          if (tc.most_recent_show_date) label += ` · latest ${tc.most_recent_show_date}`;
          touringEl.textContent = label;
          touringEl.classList.add('show');
        } else {
          touringEl.textContent = '';
          touringEl.classList.remove('show');
        }

        // ── Stat chips + fan-engagement callout ──
        // Reveal staggered right after the header; the thermometer count-up below is delayed
        // (thermoDelay) so it only begins once the chips have started animating in.
        const chipEls = renderStatChips(data.stat_chips);
        const calloutShown = renderFanCallout(data.fan_engagement);
        const calloutEl = document.getElementById('res-fan-callout');
        const CHIP_START = 120, CHIP_STEP = 90;
        const thermoDelay = CHIP_START + chipEls.length * CHIP_STEP + (calloutShown ? 160 : 60);
        if (prefersReducedMotion()) {
          chipEls.forEach(el => el.classList.add('in'));
          if (calloutShown) calloutEl.classList.add('in');
        } else {
          chipEls.forEach((el, i) => { el.style.transitionDelay = `${CHIP_START + i * CHIP_STEP}ms`; });
          if (calloutShown) calloutEl.style.transitionDelay = `${CHIP_START + chipEls.length * CHIP_STEP}ms`;
          requestAnimationFrame(() => {
            chipEls.forEach(el => el.classList.add('in'));
            if (calloutShown) calloutEl.classList.add('in');
          });
        }

        // Overall score
        const sc = statusClass(data.overall_status);
        const scoreEl  = document.getElementById('res-score-number');
        const thermoEl = document.getElementById('res-thermo');
        const badgeEl  = document.getElementById('res-status-badge');
        const scoreTarget = data.overall_score;

        badgeEl.textContent = data.overall_status.toUpperCase();
        badgeEl.className   = `status-badge ${sc}`;

        // New render owns the animation lifecycle; invalidate any in-flight prior run.
        const renderToken = ++renderVersion;
        const isStale = () => renderToken !== renderVersion;

        // Reset to the 0-state, then count up to the final value (eased) over ~1.2s, with the
        // colour interpolating red→orange→cyan and the thermometer filling in lockstep.
        scoreEl.className   = 'score-number';
        scoreEl.textContent = '0';
        scoreEl.style.color = rgb(scoreColor(0));
        thermoEl.className   = `thermometer-fill ${sc}`;
        thermoEl.style.width = '0%';
        thermoEl.style.background = rgb(scoreColor(0));
        animateProgress({
          duration: 1200,
          delay: thermoDelay,
          onFrame: (e) => {
            const v = e * scoreTarget;
            const col = rgb(scoreColor(v));
            scoreEl.textContent = Math.round(v);
            scoreEl.style.color = col;
            thermoEl.style.width = `${v}%`;
            thermoEl.style.background = col;
          },
          onDone: () => {
            const col = rgb(scoreColor(scoreTarget));
            scoreEl.textContent = scoreTarget;
            scoreEl.style.color = col;
            thermoEl.style.width = `${scoreTarget}%`;
            thermoEl.style.background = col;
            // Re-trigger the settle glow each run (remove → reflow → add).
            scoreEl.classList.remove('settled');
            void scoreEl.offsetWidth;
            scoreEl.classList.add('settled');
          },
          isStale,
        });

        // Diagnostics — render at 0, then count up each card's score/bar (~0.6s), staggered.
        const container = document.getElementById('diag-container');
        container.innerHTML = (data.diagnostics || []).map(renderDiagnostic).join('');
        container.querySelectorAll('.diagnostic-card').forEach((card, i) => {
          const numEl = card.querySelector('.diag-score');
          const barEl = card.querySelector('.diag-bar-fill');
          if (!numEl || !barEl) return;
          const target = parseFloat(numEl.dataset.target) || 0;
          animateProgress({
            duration: 600,
            delay: thermoDelay + 250 + i * 100,
            onFrame: (e) => {
              const v = e * target;
              numEl.textContent = Math.round(v);
              barEl.style.width = `${v}%`;
            },
            onDone: () => {
              numEl.textContent = target;
              barEl.style.width = `${target}%`;
            },
            isStale,
          });
        });

        // Note
        document.getElementById('res-note').textContent = data.note || '';

        setVisible(results, true);
      } catch (err) {
        errBox.textContent = 'Network error — is the server running?';
        setVisible(errBox, true);
      } finally {
        setVisible(loading, false);
        btn.disabled = false;
        reportInFlight = false;
      }
    }

    btn.addEventListener('click', runReport);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') runReport(); });
  </script>
</body>
</html>

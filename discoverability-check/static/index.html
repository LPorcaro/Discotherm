<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discoverability Check</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f11;
      color: #e8e8ec;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 40px;
    }

    .card {
      background: #18181b;
      border: 1px solid #2a2a2e;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 560px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 8px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      background: #0f0f11;
      border: 1px solid #2a2a2e;
      border-radius: 8px;
      color: #e8e8ec;
      font-size: 1rem;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus {
      border-color: #7c6af7;
    }

    button {
      background: #7c6af7;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 10px 22px;
      transition: background 0.15s, opacity 0.15s;
      white-space: nowrap;
    }

    button:hover:not(:disabled) { background: #6a58e0; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .status {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #888;
      min-height: 20px;
    }

    .status.error { color: #f87171; }

    .result-block {
      margin-top: 24px;
      display: none;
    }

    .result-block.visible { display: block; }

    .result-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 8px;
    }

    pre {
      background: #0f0f11;
      border: 1px solid #2a2a2e;
      border-radius: 8px;
      color: #a5f3a5;
      font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
      font-size: 0.8rem;
      line-height: 1.6;
      max-height: 480px;
      overflow: auto;
      padding: 16px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h1>Discoverability Check</h1>
  <p class="subtitle">Pull artist info and top tracks from Musixmatch</p>

  <div class="card">
    <label for="artist-input">Artist name</label>
    <div class="input-row">
      <input
        id="artist-input"
        type="text"
        placeholder="e.g. Radiohead"
        autocomplete="off"
      />
      <button id="submit-btn">Look up</button>
    </div>
    <p class="status" id="status"></p>

    <div class="result-block" id="result-block">
      <p class="result-label">Raw JSON response</p>
      <pre id="result-pre"></pre>
    </div>
  </div>

  <script>
    const input = document.getElementById('artist-input');
    const btn = document.getElementById('submit-btn');
    const status = document.getElementById('status');
    const resultBlock = document.getElementById('result-block');
    const resultPre = document.getElementById('result-pre');

    async function lookup() {
      const name = input.value.trim();
      if (!name) return;

      btn.disabled = true;
      status.className = 'status';
      status.textContent = 'Fetching…';
      resultBlock.classList.remove('visible');

      try {
        const res = await fetch('/artist', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }),
        });

        const data = await res.json();

        if (!res.ok) {
          status.className = 'status error';
          status.textContent = data.detail || `Error ${res.status}`;
          return;
        }

        status.textContent = '';
        resultPre.textContent = JSON.stringify(data, null, 2);
        resultBlock.classList.add('visible');
      } catch (err) {
        status.className = 'status error';
        status.textContent = 'Network error — is the server running?';
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener('click', lookup);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') lookup(); });
  </script>
</body>
</html>

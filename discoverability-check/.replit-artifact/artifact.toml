kind = "web"
previewPath = "/"
title = "Discoverability Check"
version = "1.0.0"

[[services]]
localPort = 8000
name = "Discoverability Check"
paths = ["/"]

[services.development]
run = "uvicorn main:app --host 0.0.0.0 --port 8000"

[services.production]

[services.production.build]
args = ["pip", "install", "-r", "discoverability-check/requirements.txt"]

[services.production.run]
args = ["sh", "-c", "cd discoverability-check && exec python3 -m uvicorn main:app --host 0.0.0.0 --port 8000"]

[services.production.health.startup]
path = "/"
